name: CI

# TWO triggers on purpose, deduplicated by COMMIT rather than by trigger.
#
# This used to run on `pull_request` plus `push` to main only, so the review gate rested
# entirely on the PR event — and on 2026-09-18 GitHub simply stopped creating runs for it. Four
# pushes to one branch produced a CodeQL run each and no CI run at all, while `push` to main and
# `workflow_dispatch` both kept working, the workflow stayed `active`, and this file had not been
# touched since PR #46. Cause unknown on GitHub's side; the consequence was concrete: 0.11.0 had
# to be merged with no CI, on the maintainer's explicit authorisation, with a local test run
# standing in for the gate (FH-071, SESSION-STATE §1 item 18).
#
# So the branch push is now a first-class trigger too. Either event alone produces a run on the
# exact head commit, which is what the merge gate actually needs — a gate with one trigger has a
# single point of failure, and this one failed.
#
# The old comment here worried about running the triad twice, which was the right worry and the
# wrong fix. Keying `concurrency` on the HEAD COMMIT instead of the ref solves it properly: a
# push run and a pull_request run for the same commit land in the same group, so the later one
# cancels the earlier and exactly one survives. `github.event.pull_request.head.sha` is the
# branch head on a PR event; `github.sha` is the same commit on a push.
on:
  push:
    branches: [main, "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

# Least privilege: CI only reads the repo and uploads a build artifact.
permissions:
  contents: read

jobs:
  # --- Level 1: unit — pure per-module logic (fast, no DOM host, no browser) ---
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false   # jobs run PR-controlled code and never push (artipacked hardening)
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit

  # --- Level 2: integration — modules wired together via jsdom + a mock chrome ---
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false   # jobs run PR-controlled code and never push (artipacked hardening)
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run test:integration

  # --- Level 3: system — the packaged extension in real headless Chromium ---
  system:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false   # jobs run PR-controlled code and never push (artipacked hardening)
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - run: npm run test:system # builds the extension, then drives it end-to-end

  # --- Publish the green build so end users / the auto-updater never build locally ---
  package:
    needs: [unit, integration, system]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false   # jobs run PR-controlled code and never push (artipacked hardening)
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run build
      - name: Upload prebuilt extension (green build)
        uses: actions/upload-artifact@v4
        with:
          name: feedhacker-extension
          path: |
            dist/feedhacker/**
            dist/feedhacker-*.zip
          if-no-files-found: error
          retention-days: 90
