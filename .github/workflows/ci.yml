name: CI

# TWO triggers on purpose, deduplicated by COMMIT rather than by trigger.
#
# This used to run on `pull_request` plus `push` to main only, so the review gate rested entirely
# on the PR event. On 2026-09-18 that event produced nothing: four pushes to one branch made a
# CodeQL run each and no CI run at all, checked four times over two hours, while `push` to main
# and `workflow_dispatch` kept working, the workflow stayed `active`, and this file had not been
# touched since PR #46. 0.11.0 was merged with no CI on the maintainer's explicit authorisation.
#
# It was TRANSIENT and platform-side: by 2026-09-19 21:31 the trigger was firing again on this
# same branch (runs 423 and 425, both `event: pull_request`, both success). So nothing here caused
# it and nothing here cured it — but a gate reached by ONE trigger has a single point of failure,
# and for one day that gate did not exist. Hence the branch push as a first-class trigger: either
# event alone produces a run on the exact head commit, which is what the merge gate needs.
#
# The obvious objection is that the triad now runs twice, which is the right worry and the wrong
# fix. Keying `concurrency` on the HEAD COMMIT instead of the ref solves it properly: a push run
# and a pull_request run for the same commit land in the same group, so the later one cancels the
# earlier and exactly one survives. `github.event.pull_request.head.sha` is the branch head on a
# PR event; `github.sha` is the same commit on a push. See FH-071 and best_practices.md §75.
on:
  push:
    branches: [main, "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

# Least privilege: CI only reads the repo and uploads a build artifact.
permissions:
  contents: read

# Local first (owner's Actions rules, 2026-10-05): every job runs on the owner's PC through the
# runs-on expression below, which MU/TH/UR recognises byte for byte and points at the runner it
# controls with RUNNER. With RUNNER unset a job waits for the PC; GitHub-hosted only with HOSTED_OK
# or for a fork's pull request. No job here reads a secret (rule 3 does not apply).
jobs:
  # --- Docs-only changes (docs/, root *.md, LICENSE) skip the levels below (Actions rule 4).
  # Anything unreadable counts as code (absent is not zero). --no-renames lists a rename's old path
  # too, so moving code into docs/ still runs the tests.
  changes:
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (vars.RUNNER && fromJSON(vars.RUNNER) || vars.HOSTED_OK == 'true' && 'ubuntu-latest' || fromJSON('["self-hosted","linux","mother"]')) || 'ubuntu-latest' }}
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: changes
        name: Docs-only change?
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            files=$(git diff --name-only --no-renames "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" || true)
          else
            files=$(git diff --name-only --no-renames "${{ github.event.before }}" "${{ github.sha }}" 2>/dev/null || true)
          fi
          # CLAUDE.md and SESSION-STATE.md are Markdown, but test/unit/session-state.test.js reads them,
          # so a change to either is a code change for this gate.
          if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qvE '^(docs/|LICENSE$|[^/]+\.md$)' \
            && ! printf '%s\n' "$files" | grep -qxE '(CLAUDE|SESSION-STATE)\.md'; then code=false; else code=true; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "changed files: $(printf '%s\n' "$files" | wc -l); code=$code"

  # --- Level 1: unit — pure per-module logic (fast, no DOM host, no browser) ---
  unit:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (vars.RUNNER && fromJSON(vars.RUNNER) || vars.HOSTED_OK == 'true' && 'ubuntu-latest' || fromJSON('["self-hosted","linux","mother"]')) || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false   # jobs run PR-controlled code and never push (artipacked hardening)
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit

  # --- Level 2: integration — modules wired together via jsdom + a mock chrome ---
  integration:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (vars.RUNNER && fromJSON(vars.RUNNER) || vars.HOSTED_OK == 'true' && 'ubuntu-latest' || fromJSON('["self-hosted","linux","mother"]')) || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false   # jobs run PR-controlled code and never push (artipacked hardening)
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run test:integration

  # --- Level 3: system — the packaged extension in real headless Chromium ---
  system:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (vars.RUNNER && fromJSON(vars.RUNNER) || vars.HOSTED_OK == 'true' && 'ubuntu-latest' || fromJSON('["self-hosted","linux","mother"]')) || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false   # jobs run PR-controlled code and never push (artipacked hardening)
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      # --with-deps installs system packages with sudo apt: GitHub-hosted only. On the owner's PC
      # (no sudo on the runner) only the browser is fetched; its libraries are installed once there.
      - name: Install Chromium for Playwright
        run: |
          if [ "$RUNNER_ENVIRONMENT" = "github-hosted" ]; then npx playwright install --with-deps chromium; else npx playwright install chromium; fi
      - run: npm run test:system # builds the extension, then drives it end-to-end

  # --- Publish the green build so end users / the auto-updater never build locally ---
  package:
    # A docs-only change skips the three tiers, so this skips with them.
    needs: [unit, integration, system]
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (vars.RUNNER && fromJSON(vars.RUNNER) || vars.HOSTED_OK == 'true' && 'ubuntu-latest' || fromJSON('["self-hosted","linux","mother"]')) || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false   # jobs run PR-controlled code and never push (artipacked hardening)
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run build
      - name: Upload prebuilt extension (green build)
        uses: actions/upload-artifact@v4
        with:
          name: feedhacker-extension
          path: |
            dist/feedhacker/**
            dist/feedhacker-*.zip
          if-no-files-found: error
          retention-days: 90
