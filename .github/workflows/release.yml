name: Release

# Publish a ready-to-install build so end users never touch source or build tools.
# Tag a version (e.g. `git tag v0.2.0 && git push --tags`) to cut a GitHub Release with
# the prebuilt extension zip, the Windows one-click bundle, and a best-effort MSI, and —
# when Chrome Web Store credentials are configured as secrets — to upload the same version
# to the Web Store so Google auto-updates every store user. See store/README.md.
# You can also release without pushing a tag: run this workflow manually (Actions →
# Release → Run workflow) with `publish: true`. It cuts the release straight from the
# chosen branch, tagging it `v<manifest version>` from inside the Action — handy when
# your local git can't push tags. Leave `publish` false for a build-only dry run.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Cut the GitHub Release and upload to the Chrome Web Store from this branch (tag = v<manifest version>). Off = build-only dry run."
        type: boolean
        default: false

# Least privilege by default; only the job that publishes the release gets write.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # Best-effort Windows MSI. Never blocks the release: if WiX build fails, the release
  # still ships the zips.
  msi:
    needs: build
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Stage MSI payload (prebuilt extension + installer scripts)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installer/windows/payload/feedhacker | Out-Null
          Copy-Item dist/feedhacker/* installer/windows/payload/feedhacker -Recurse -Force
          New-Item -ItemType Directory -Force -Path installer/windows/payload/installer | Out-Null
          Copy-Item installer/windows/*.ps1, installer/windows/*.bat installer/windows/payload/installer -Force
      - name: Install WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix
          Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\.dotnet\tools"
      - name: Build MSI
        shell: pwsh
        working-directory: installer/windows # so `payload\**` and feedhacker.wxs resolve locally
        run: |
          $v = (Get-Content ../../dist/feedhacker/manifest.json -Raw | ConvertFrom-Json).version
          wix build feedhacker.wxs -d Version=$v -arch x64 -o "../../dist/FeedHacker-$v.msi"
      - uses: actions/upload-artifact@v4
        with:
          name: msi
          path: dist/*.msi
          if-no-files-found: ignore

  release:
    needs: [build, msi]
    if: ${{ startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # publish the GitHub Release (and, on manual publish, create/repoint the tag)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: msi
          path: dist
      - name: Create GitHub Release with prebuilt assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          # Derive the version from the built artifact so the notes match the asset
          # filenames even if the git tag and manifest.json ever disagree.
          VERSION="$(jq -r .version dist/feedhacker/manifest.json)"
          # Tag from the pushed ref, or — on a manual publish run — from the manifest
          # version.
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="v${VERSION}"
            # Manual publish: create the tag ourselves (the runner's token can push tags,
            # unlike a scoped sandbox) so `gh release create` publishes a REAL release
            # rather than a draft. Clear any prior release/tag for this version first —
            # including a leftover draft — so we end up with exactly one published release
            # pinned to the built commit. A tag pushed with GITHUB_TOKEN does not re-trigger
            # this workflow, so there is no loop.
            gh release delete "$TAG" --yes --cleanup-tag >/dev/null 2>&1 || true
            git tag -f "$TAG" "$GITHUB_SHA"
            git push -f origin "refs/tags/${TAG}"
          else
            TAG="$GITHUB_REF_NAME"
          fi
          NOTES=$(cat <<EOF
          ## Install FeedHacker (no build, no source)

          **Easiest (Windows):** download \`feedhacker-${VERSION}-win.zip\`, unzip, double-click \`installer/install.bat\`. It installs the prebuilt extension, sets up daily auto-updates, and walks you through the one-time "Load unpacked" click Chrome requires.

          **Any browser (manual):** download \`feedhacker-${VERSION}.zip\`, unzip, open \`chrome://extensions\`, turn on **Developer mode**, click **Load unpacked**, and pick the unzipped \`feedhacker\` folder.

          > Chrome only allows silent, one-click install from the Chrome Web Store. Everything here is the closest no-account alternative.

          _These assets are published automatically only after CI passes on all three test levels (unit, integration, system)._
          EOF
          )
          shopt -s nullglob
          ASSETS=(dist/feedhacker-*.zip dist/*.msi)
          # Idempotent: a release may already exist for this tag (e.g. a tag push whose
          # release was drafted in the GitHub UI). Update it in place instead of erroring
          # on "already exists"; otherwise create it. The tag already exists by now (pushed
          # above on a manual run, or the trigger ref on a tag push), so `gh release create`
          # publishes a normal release — no --target, which would draft it.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "FeedHacker $TAG" \
              --notes "$NOTES"
            [ ${#ASSETS[@]} -gt 0 ] && gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" \
              --title "FeedHacker $TAG" \
              --notes "$NOTES" \
              "${ASSETS[@]}"
          fi

  # Chrome Web Store upload — the path that actually updates end users: Google pushes the
  # new version to every store install automatically (usually within hours-days of
  # approval). Opt-in and best-effort: it runs only when the CWS_* secrets are set, and
  # continue-on-error means a missing/rejected upload never fails the GitHub Release above.
  # Requires (repo Settings → Secrets and variables → Actions):
  #   secrets CWS_CLIENT_ID, CWS_CLIENT_SECRET, CWS_REFRESH_TOKEN  (Google OAuth creds)
  #   variable CWS_AUTO_PUBLISH = "true" to submit for review automatically; otherwise the
  #            new version is uploaded as a draft and you click "Publish" in the dashboard.
  #   variable CWS_PUBLISHER_ID  (optional) enables the "cancel pending submission" step below,
  #            which frees the one-pending-version slot so a release isn't blocked behind a
  #            version still in review. Dashboard -> Publisher > Settings.
  # The store rejects a version that isn't higher than the live one, so bump manifest.json
  # every release (package.json is kept in lockstep).
  webstore:
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}       # job-level so the guard `if` can read it
      # Accept the id from EITHER tab. Settings has "Secrets" and "Variables" side by side, and
      # on the v0.4.8 release this resolved empty — the cancel step skipped silently and the
      # release looked entirely green while doing nothing (FH-048).
      CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID || secrets.CWS_PUBLISHER_ID }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Locate the store package
        id: zip
        run: |
          set -e
          zip="$(ls dist/feedhacker-*-store.zip | head -1)"
          test -n "$zip"
          echo "path=$zip" >> "$GITHUB_OUTPUT"
      # The store accepts ONE pending version at a time, so a release cut while the previous
      # one is still in review fails with ITEM_NOT_UPDATABLE and the fix never reaches users.
      # This is the API equivalent of the dashboard's "Cancel review" (Store listing -> ... ->
      # Cancel review): it returns the pending submission to draft and frees the slot for the
      # upload below. CWS API v2, same OAuth credentials and scope as the v1 upload.
      #
      # Deliberately BEST-EFFORT and non-fatal:
      #   * "nothing pending" is the normal case, not an error — the API is called blind
      #     because there is no cheap way to ask first, and a 4xx here is expected;
      #   * a cancel that fails must never take a release down, so the step swallows its own
      #     failure and lets the upload step report the real outcome;
      #   * without CWS_PUBLISHER_ID the step is skipped entirely and the release behaves
      #     exactly as it did before this existed.
      # Note the publisher cap: at most six cancels per publisher per day.
      - name: Cancel a pending Chrome Web Store submission
        if: env.CWS_CLIENT_ID != ''
        continue-on-error: true
        env:
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          EXTENSION_ID: kccajfoghkplakndamlohpepopdpelkb   # public id from the store URL
        run: |
          # No `set -e`: every failure here is tolerable and must not abort the job.
          set -uo pipefail
          # Announce the misconfiguration instead of vanishing. This used to be an `if:` guard on
          # the step, so a publisher id in the wrong place produced a SKIPPED step and a green
          # release that had silently done nothing — the false-green class §4 exists to prevent.
          if [ -z "${CWS_PUBLISHER_ID:-}" ]; then
            echo "::warning title=Store cancel disabled::CWS_PUBLISHER_ID is empty, so a version already in review was NOT withdrawn. If the upload below fails with ITEM_NOT_UPDATABLE, that is why. Add CWS_PUBLISHER_ID (Dashboard -> Publisher > Settings) under Settings -> Secrets and variables -> Actions, in either the Variables or the Secrets tab."
            exit 0
          fi
          # Refresh-token -> access token. -sS keeps curl quiet but still prints real errors;
          # the response is parsed with python3 (present on ubuntu-latest) rather than grep so
          # a malformed body can't silently yield a half-token.
          tok="$(curl -sS "https://oauth2.googleapis.com/token" \
                   -d "client_id=$CWS_CLIENT_ID" \
                   -d "client_secret=$CWS_CLIENT_SECRET" \
                   -d "refresh_token=$CWS_REFRESH_TOKEN" \
                   -d "grant_type=refresh_token" \
                 | python3 -c "import json,sys; print(json.load(sys.stdin).get('access_token',''))" 2>/dev/null)"
          if [ -z "$tok" ]; then
            echo "Could not mint an access token — skipping the cancel; the upload will report the real state."
            exit 0
          fi
          url="https://chromewebstore.googleapis.com/v2/publishers/$CWS_PUBLISHER_ID/items/$EXTENSION_ID:cancelSubmission"
          # -o/-w so the token is never echoed and only the status code reaches the log.
          code="$(curl -sS -o /tmp/cws-cancel.out -w '%{http_code}' -X POST "$url" \
                    -H "Authorization: Bearer $tok" -H "Content-Length: 0")"
          if [ "$code" = "200" ] || [ "$code" = "204" ]; then
            echo "Cancelled the pending submission — the slot is free for this upload."
          else
            echo "No pending submission cancelled (HTTP $code). This is normal when nothing is in review."
            head -c 500 /tmp/cws-cancel.out || true; echo
          fi
          exit 0

      - name: Upload to the Chrome Web Store
        if: env.CWS_CLIENT_ID != ''   # skip cleanly (green) when store publishing isn't configured
        env:
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_AUTO_PUBLISH: ${{ vars.CWS_AUTO_PUBLISH }}
          EXTENSION_ID: kccajfoghkplakndamlohpepopdpelkb   # public id from the store URL
        run: |
          set -e
          ARGS=(upload
            --source "${{ steps.zip.outputs.path }}"
            --extension-id "$EXTENSION_ID"
            --client-id "$CWS_CLIENT_ID"
            --client-secret "$CWS_CLIENT_SECRET"
            --refresh-token "$CWS_REFRESH_TOKEN")
          pub="${CWS_AUTO_PUBLISH:-}"   # case-insensitive: accept true/True/TRUE
          if [ "${pub,,}" = "true" ]; then ARGS+=(--auto-publish); fi
          npx --yes chrome-webstore-upload-cli@3 "${ARGS[@]}"
